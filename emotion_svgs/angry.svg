<svg width="128" height="64" viewBox="0 0 128 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="64" rx="8" fill="#000"/>
  <!-- Left Eye: eyeW=14 eyeH=10 at (40,28) narrow squint -->
  <rect x="26" y="18" width="28" height="20" rx="6" ry="6" fill="#fff"/>
  <circle cx="40" cy="28" r="3" fill="#000"/>
  <!-- Left Eyebrow: browLAngle=8 browLen=18 browOffY=4, angled inward-down -->
  <line x1="31" y1="10" x2="49" y2="17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Eye -->
  <rect x="74" y="18" width="28" height="20" rx="6" ry="6" fill="#fff"/>
  <circle cx="88" cy="28" r="3" fill="#000"/>
  <!-- Right Eyebrow: mirrored angle -->
  <line x1="97" y1="10" x2="79" y2="17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth: tight frown mouthCurve=-6 mouthW=10 mouthY=49 -->
  <path d="M 54,49 Q 64,43 74,49" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
